<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý dự án &amp; dịch vụ</title>
<style>
  :root {
    color-scheme: light;
    --bg:#f3f5fa; --surface:#ffffff; --surface2:#f7f8fc; --ink:#0f1730; --ink2:#4a5373; --mut:#8089a6; --line:#e6e9f2; --line2:#d6dbe8;
    --acc:#2a62e8; --acc2:#6250d6; --acc-ink:#ffffff; --accbg:#eaf0ff;
    --s1:#2a78d6; --s2:#eb6834;                       /* categorical slot 1-2 (validated) */
    --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95; --q7:#0d366b; /* sequential blue */
    --good:#0ca30c; --goodtx:#006300; --goodbg:#e6f6e6; --warn:#e9a000; --warntx:#8a5200; --warnbg:#fff4de;
    --bad:#d03b3b; --badtx:#b42318; --badbg:#fdeceb; --info:#2a62e8; --infobg:#eaf0ff;
    --shadow:0 1px 2px rgba(15,23,48,.04),0 8px 24px -12px rgba(15,23,48,.12); --shadow2:0 2px 4px rgba(15,23,48,.06),0 18px 40px -16px rgba(15,23,48,.22);
    --side1:#0e1a3d; --side2:#1b2d6b; --r:16px;
  }
  @media (prefers-color-scheme: dark) { :root {
    color-scheme: dark;
    --bg:#0c0f1a; --surface:#141929; --surface2:#1a2033; --ink:#eef0f8; --ink2:#b5bcd6; --mut:#7e87a6; --line:#242b42; --line2:#2f3752;
    --acc:#6f8bff; --acc2:#9085e9; --acc-ink:#0b0f1a; --accbg:#1b2442;
    --s1:#3987e5; --s2:#d95926;
    --q1:#184f95; --q2:#1c5cab; --q3:#256abf; --q4:#2a78d6; --q5:#3987e5; --q6:#6da7ec; --q7:#9ec5f4;
    --goodtx:#4fd08f; --goodbg:#12281c; --warn:#fab219; --warntx:#f0b54d; --warnbg:#33260c; --bad:#e66767; --badtx:#f4877d; --badbg:#35171a; --info:#84adff; --infobg:#1b2442;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); --shadow2:0 2px 4px rgba(0,0,0,.4),0 22px 44px -16px rgba(0,0,0,.7);
  } }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:inherit; }
  svg { display:block; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; border-radius:8px; }

  /* ---- khung ứng dụng ---- */
  .app { display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh; }
  .side { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:6px; padding:20px 14px 16px; color:#cfd8ff; background:radial-gradient(120% 60% at 0% 0%,#26408f 0%,transparent 60%),linear-gradient(180deg,var(--side1),var(--side2)); }
  .logo { display:flex; align-items:center; gap:11px; padding:2px 8px 18px; }
  .logo i { width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-style:normal; font-weight:800; letter-spacing:.02em; color:#fff; background:linear-gradient(135deg,#4d86ff,#8f6bff); box-shadow:0 8px 20px -6px rgba(95,120,255,.7); }
  .logo b { display:block; color:#fff; font-size:15px; line-height:1.15; } .logo small { color:#93a3dd; font-size:11.5px; }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav a { position:relative; display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:#b9c5f2; text-decoration:none; font-weight:600; cursor:pointer; transition:background .15s,color .15s; }
  .nav a:hover { background:rgba(255,255,255,.07); color:#fff; }
  .nav a.on { background:rgba(255,255,255,.13); color:#fff; box-shadow:inset 3px 0 0 #86a8ff; }
  .nav a .n { margin-left:auto; min-width:20px; padding:0 6px; text-align:center; border-radius:999px; font-size:11px; font-weight:700; color:#fff; background:#e5484d; }
  .side .me { margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; background:rgba(255,255,255,.07); }
  .av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; color:#fff; background:linear-gradient(135deg,#4d86ff,#8f6bff); flex:none; }
  .me b { display:block; color:#fff; font-size:13px; line-height:1.2; } .me small { color:#93a3dd; font-size:11.5px; }
  .content { min-width:0; }
  .demo { background:linear-gradient(90deg,#f59e0b,#f97316); color:#fff; text-align:center; font-size:12px; font-weight:700; padding:5px 10px; letter-spacing:.01em; }
  .top { position:sticky; top:0; z-index:8; display:flex; align-items:center; gap:12px; padding:14px 28px; background:color-mix(in srgb,var(--bg) 82%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid transparent; }
  .top h1 { font-size:20px; letter-spacing:-.01em; margin:0; white-space:nowrap; }
  .top .sp { flex:1; }
  .search { position:relative; width:min(360px,34vw); }
  .search input { width:100%; padding:9px 12px 9px 36px; border-radius:12px; border:1px solid var(--line); background:var(--surface); outline:none; transition:border-color .15s,box-shadow .15s; }
  .search input:focus { border-color:var(--acc); box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent); }
  .search .sico { position:absolute; left:11px; top:10px; color:var(--mut); pointer-events:none; }
  .search kbd { position:absolute; right:9px; top:8px; font:600 11px system-ui; color:var(--mut); border:1px solid var(--line); border-radius:6px; padding:1px 6px; background:var(--surface2); }
  .results { position:absolute; top:44px; left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow2); overflow:hidden; z-index:30; max-height:60vh; overflow-y:auto; }
  .results a { display:flex; gap:10px; align-items:center; padding:9px 12px; cursor:pointer; text-decoration:none; } .results a:hover, .results a.sel { background:var(--surface2); }
  .results small { color:var(--mut); } .results .grp { padding:7px 12px 3px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  main { padding:6px 28px 90px; display:grid; gap:18px; max-width:1280px; }
  .btn { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:11px; border:1px solid var(--line2); background:var(--surface); font-weight:600; transition:transform .12s,box-shadow .15s,background .15s; }
  .btn:hover { background:var(--surface2); } .btn:active { transform:scale(.97); }
  .btn.primary { background:linear-gradient(135deg,var(--acc),var(--acc2)); border-color:transparent; color:#fff; box-shadow:0 8px 18px -8px color-mix(in srgb,var(--acc) 80%,transparent); }
  .btn.primary:hover { filter:brightness(1.07); }
  .btn.danger { color:var(--badtx); } .btn.sm { padding:5px 10px; font-size:12.5px; border-radius:9px; } .btn:disabled { opacity:.5; pointer-events:none; }
  .btn.ghost { background:transparent; border-color:transparent; color:var(--ink2); } .btn.ghost:hover { background:var(--surface2); }

  /* ---- thẻ, lưới ---- */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; box-shadow:var(--shadow); min-width:0; animation:rise .45s cubic-bezier(.2,.7,.2,1) both; }
  .card.flat { box-shadow:none; }
  .card h2 { margin:0; font-size:15px; letter-spacing:-.005em; } .card .sub { color:var(--mut); font-size:12.5px; margin-top:1px; }
  .ch { display:flex; align-items:flex-start; gap:10px; margin-bottom:14px; } .ch .r { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .g { display:grid; gap:18px; } .g2 { grid-template-columns:repeat(2,minmax(0,1fr)); } .g3 { grid-template-columns:repeat(3,minmax(0,1fr)); } .g4 { grid-template-columns:repeat(4,minmax(0,1fr)); } .g21 { grid-template-columns:minmax(0,2fr) minmax(0,1fr); } .g12 { grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .g > .card:nth-child(2) { animation-delay:.05s } .g > .card:nth-child(3) { animation-delay:.1s } .g > .card:nth-child(4) { animation-delay:.15s }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* ---- hero ---- */
  .hero { position:relative; overflow:hidden; border:0; color:#fff; padding:24px 26px; background:radial-gradient(90% 140% at 100% 0%,rgba(143,107,255,.55),transparent 55%),radial-gradient(70% 120% at 0% 100%,rgba(77,134,255,.5),transparent 60%),linear-gradient(135deg,#0e1a3d,#1d3482); box-shadow:var(--shadow2); }
  .hero:after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 22px); pointer-events:none; }
  .hero > * { position:relative; z-index:1; }
  .hero .hi { color:#b8c6f7; font-size:13px; font-weight:600; } .hero h2 { color:#fff; font-size:22px; margin:2px 0 16px; letter-spacing:-.015em; }
  .hero-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:26px; align-items:end; }
  .big { font-size:62px; line-height:1; font-weight:750; letter-spacing:-.035em; } .big small { font-size:28px; font-weight:650; margin-left:2px; opacity:.85; }
  .hero .lab { color:#b8c6f7; font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:8px; }
  .hero .meter { height:8px; border-radius:99px; background:rgba(255,255,255,.18); margin:14px 0 8px; overflow:hidden; } .hero .meter i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#7fb0ff,#b7a7ff); transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .hero .note { color:#c5d0fa; font-size:12.5px; }
  .pulse { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pulse button { text-align:left; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08); border-radius:14px; padding:12px 13px; color:#fff; transition:background .15s,transform .12s; backdrop-filter:blur(6px); }
  .pulse button:hover { background:rgba(255,255,255,.15); transform:translateY(-2px); }
  .pulse b { display:block; font-size:30px; line-height:1.05; letter-spacing:-.02em; } .pulse span { font-size:12px; color:#c5d0fa; }
  .pulse .hot b { color:#ffb4a8; }

  /* ---- KPI ---- */
  .kpi { display:grid; gap:2px; cursor:default; }
  .kpi .l { font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); display:flex; align-items:center; gap:7px; }
  .kpi .l i { width:22px; height:22px; border-radius:7px; display:grid; place-items:center; background:var(--accbg); color:var(--acc); }
  .kpi .v { font-size:30px; font-weight:750; letter-spacing:-.025em; line-height:1.15; margin-top:6px; }
  .kpi .row { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .delta { display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; padding:1px 7px; border-radius:99px; }
  .delta.good { background:var(--goodbg); color:var(--goodtx); } .delta.bad { background:var(--badbg); color:var(--badtx); } .delta.flat { background:var(--surface2); color:var(--mut); }
  .kpi .s { font-size:12px; color:var(--mut); margin-top:2px; }
  .meter { height:7px; border-radius:99px; background:var(--accbg); overflow:hidden; } .meter i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--q4),var(--acc)); transition:width .8s cubic-bezier(.2,.8,.2,1); }
  .meter.warn i { background:linear-gradient(90deg,#fab219,#e9a000); } .meter.bad i { background:linear-gradient(90deg,#ec835a,#d03b3b); }

  /* ---- chip ---- */
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:650; background:var(--surface2); color:var(--ink2); white-space:nowrap; }
  .chip:before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9; }
  .chip.ok { background:var(--goodbg); color:var(--goodtx); } .chip.bad { background:var(--badbg); color:var(--badtx); } .chip.warn { background:var(--warnbg); color:var(--warntx); } .chip.info { background:var(--infobg); color:var(--info); } .chip.plain:before { display:none; }

  /* ---- biểu đồ ---- */
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); } .legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; } .legend i.sq { height:10px; width:10px; border-radius:3px; }
  .chartbox { width:100%; position:relative; } .chartbox svg text { font:11px system-ui,sans-serif; fill:var(--mut); }
  .hb { display:grid; gap:11px; } .hb .r { display:grid; grid-template-columns:minmax(96px,40%) 1fr auto; gap:10px; align-items:center; cursor:default; border-radius:8px; padding:1px 4px; margin:-1px -4px; transition:background .12s; }
  .hb .r.k { cursor:pointer; } .hb .r:hover { background:var(--surface2); }
  .hb .nm { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hb .tr { height:12px; border-radius:0 6px 6px 0; } .hb .bar { height:100%; border-radius:0 5px 5px 0; width:0; transition:width .8s cubic-bezier(.2,.8,.2,1); } .hb .val { font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }
  .stack { display:flex; gap:2px; height:22px; } .stack i { display:block; min-width:4px; transition:flex .8s cubic-bezier(.2,.8,.2,1),filter .12s; } .stack i:first-child { border-radius:6px 0 0 6px; } .stack i:last-child { border-radius:0 6px 6px 0; } .stack i:only-child { border-radius:6px; } .stack i:hover { filter:brightness(1.12); }
  .kv { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px 18px; margin-top:12px; } .kv div { font-size:12.5px; color:var(--ink2); } .kv b { display:block; font-size:18px; color:var(--ink); font-weight:700; }
  .tbtn { font-size:12px; padding:3px 9px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--ink2); }
  .tip { position:fixed; z-index:60; pointer-events:none; background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:10px; font-size:12.5px; box-shadow:var(--shadow2); max-width:260px; opacity:0; transition:opacity .08s; } .tip.on { opacity:1; }
  .tip b { font-size:14px; } .tip .k { display:inline-block; width:12px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; } .tip .m { opacity:.7; }

  /* ---- danh sách / timeline ---- */
  .list { display:grid; } .it { display:flex; gap:12px; align-items:center; padding:11px 6px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:10px; transition:background .12s; } .it:last-child { border-bottom:0; } .it:hover { background:var(--surface2); }
  .it .t { font-weight:650; } .it .d { color:var(--mut); font-size:12.5px; } .it .r { margin-left:auto; text-align:right; flex:none; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .ico { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:none; background:var(--accbg); color:var(--acc); } .ico.bad { background:var(--badbg); color:var(--badtx); } .ico.warn { background:var(--warnbg); color:var(--warntx); } .ico.ok { background:var(--goodbg); color:var(--goodtx); }
  .dt { width:46px; text-align:center; border-radius:12px; background:var(--surface2); padding:4px 0; flex:none; } .dt b { display:block; font-size:18px; line-height:1.1; } .dt small { font-size:10.5px; text-transform:uppercase; color:var(--mut); font-weight:700; letter-spacing:.05em; } .dt.soon { background:var(--warnbg); } .dt.soon small { color:var(--warntx); } .dt.now { background:var(--badbg); } .dt.now small { color:var(--badtx); }
  .empty { text-align:center; color:var(--mut); padding:26px 10px; } .empty svg { margin:0 auto 8px; opacity:.55; }
  .tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .tools input, .tools select { padding:8px 12px; border-radius:11px; border:1px solid var(--line); background:var(--surface); outline:none; } .tools input { flex:1; min-width:180px; } .tools input:focus { border-color:var(--acc); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; } .pill { padding:5px 12px; border-radius:99px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:12.5px; color:var(--ink2); } .pill.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .tbl { overflow-x:auto; margin:0 -8px; } table { width:100%; border-collapse:collapse; font-size:13px; } th { text-align:left; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); padding:8px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); } td { padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; } tr.click { cursor:pointer; transition:background .1s; } tr.click:hover { background:var(--surface2); } td.nm { font-weight:650; }
  .kan { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(236px,1fr); gap:12px; overflow-x:auto; padding:2px 2px 12px; scroll-snap-type:x proximity; }
  .kan .col { background:var(--surface2); border-radius:14px; padding:10px; min-height:90px; scroll-snap-align:start; } .kan .col h3 { margin:2px 4px 10px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); display:flex; gap:6px; align-items:center; } .kan .col h3 span { margin-left:auto; background:var(--surface); border-radius:99px; padding:0 8px; }
  .kan .col .bar { height:4px; border-radius:99px; margin:0 4px 10px; }
  .kan .c { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s,box-shadow .15s; } .kan .c:hover { transform:translateY(-2px); box-shadow:var(--shadow2); }
  .dl { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px 22px; } .dl div small { display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); font-weight:700; } .dl div span { display:block; margin-top:1px; overflow-wrap:anywhere; }
  .banner { display:flex; gap:14px; align-items:center; flex-wrap:wrap; } .banner .ico { width:48px; height:48px; border-radius:15px; } .banner h2 { font-size:21px; letter-spacing:-.015em; margin:0; }
  .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
  .fact b { display:block; font-size:22px; letter-spacing:-.02em; line-height:1.2; } .fact small { color:var(--mut); font-size:12.5px; } .fact .meter { margin-top:8px; }
  .oc { display:grid; gap:8px; border-left:4px solid var(--line2); } .oc.p-khan_cap { border-left-color:var(--bad); } .oc.p-cao { border-left-color:var(--warn); }
  .oc .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .oc .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; } .oc .acts .btn { flex:1; justify-content:center; min-height:44px; } .oc h3 { margin:0; font-size:15px; }
  .skel { background:linear-gradient(100deg,var(--line) 30%,var(--surface2) 50%,var(--line) 70%); background-size:200% 100%; animation:sh 1.2s linear infinite; border-radius:12px; } @keyframes sh { to { background-position:-200% 0; } }
  .gate { min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(80% 60% at 20% 0%,rgba(77,134,255,.35),transparent 60%),radial-gradient(70% 60% at 90% 100%,rgba(143,107,255,.35),transparent 60%),linear-gradient(160deg,#0e1a3d,#1b2d6b); }
  .gate .box { width:min(420px,100%); background:rgba(255,255,255,.96); color:#0f1730; border-radius:22px; padding:30px 28px; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); text-align:center; display:grid; gap:12px; } .gate h1 { margin:6px 0 0; font-size:22px; letter-spacing:-.015em; } .gate p { margin:0; color:#5b6485; } .gate .logo { justify-content:center; padding:0; } .gate .logo i { width:54px; height:54px; border-radius:16px; font-size:18px; }
  .gate .btn { justify-content:center; padding:13px; font-size:15px; width:100%; color:#0f1730; background:#fff; } .gate .btn.primary { color:#fff; background:linear-gradient(135deg,#2a62e8,#6250d6); border-color:transparent; }
